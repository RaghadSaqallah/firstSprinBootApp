server.port=9090
spring.application.name=springbootapp
# 1. \u062a\u0639\u0631\u064a\u0641 \u0627\u0644\u0640 Driver (\u0636\u0631\u0648\u0631\u064a \u062c\u062f\u0627\u064b \u0644\u0645\u0633\u062a\u0648\u0649 \u0639\u0627\u0644\u064d \u0645\u0646 \u0627\u0644\u062a\u0648\u0627\u0641\u0642\u064a\u0629)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. \u0631\u0627\u0628\u0637 \u0627\u0644\u0627\u062a\u0635\u0627\u0644 \u0628\u0642\u0627\u0639\u062f\u0629 \u0627\u0644\u0628\u064a\u0627\u0646\u0627\u062a
spring.datasource.url=jdbc:mysql://localhost:3306/student_db?useSSL=false&serverTimezone=UTC

# 3. \u0627\u0633\u0645 \u0627\u0644\u0645\u0633\u062a\u062e\u062f\u0645 \u0648\u0643\u0644\u0645\u0629 \u0627\u0644\u0645\u0631\u0648\u0631
spring.datasource.username=root
spring.datasource.password=

# 4. \u0625\u0639\u062f\u0627\u062f\u0627\u062a Hibernate (JPA)
# ddl-auto=update: \u064a\u0642\u0648\u0645 \u0628\u0625\u0646\u0634\u0627\u0621 \u0648\u062a\u0639\u062f\u064a\u0644 \u0627\u0644\u062c\u062f\u0627\u0648\u0644 \u062a\u0644\u0642\u0627\u0626\u064a\u0627\u064b \u0628\u0646\u0627\u0621\u064b \u0639\u0644\u0649 \u0643\u0644\u0627\u0633 \u0627\u0644\u0640 Student
spring.jpa.hibernate.ddl-auto=update
# \u064a\u0638\u0647\u0631 \u0627\u0633\u062a\u0639\u0644\u0627\u0645\u0627\u062a SQL \u0641\u064a \u0627\u0644\u0640 Console \u0644\u062a\u0639\u0631\u0641 \u0645\u0627\u0630\u0627 \u064a\u062d\u062f\u062b \u062e\u0644\u0641 \u0627\u0644\u0643\u0648\u0627\u0644\u064a\u0633
spring.jpa.show-sql=true
# \u062a\u062d\u062f\u064a\u062f \u0627\u0644\u0640 Dialect \u0644\u064a\u0641\u0647\u0645 Hibernate \u0623\u0646\u0646\u0627 \u0646\u062a\u0639\u0627\u0645\u0644 \u0645\u0639 MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect